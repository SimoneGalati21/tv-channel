<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Libera</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --tile: #1b2030; --text: #eef1f7;
    --muted: #8a93a8; --accent: #4f8cff; --focus: #ffffff;
    --rai: #2f6fde; --mediaset: #e0453a; --wbd: #2bb5a0; --altri: #8b6ad8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100%;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  body.playing { overflow: hidden; }
  #grid-view { padding: 0 3vw 3vw; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 2.2vw 0 1.2vw; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.6vw; }
  header h1 { font-size: 2.4vw; font-weight: 600; letter-spacing: .02em; }
  header .hint { color: var(--muted); font-size: 1.05vw; }
  #clock { font-size: 2vw; color: var(--muted); font-variant-numeric: tabular-nums; }

  #grid { display: flex; flex-wrap: wrap; gap: 1.1vw; padding: .6vw; }
  .tile { width: calc((100% - 5 * 1.1vw) / 6); height: 10.6vw; background: var(--tile);
    border-radius: .8vw; position: relative; padding: 1vw 1.1vw; display: flex; flex-direction: column;
    justify-content: flex-end; border: .22vw solid transparent; transition: transform .12s, border-color .12s, background .12s; cursor: pointer; }
  .tile .num { position: absolute; top: .8vw; left: 1.1vw; font-size: 1.2vw; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile .bar { position: absolute; top: 0; left: 0; right: 0; height: .35vw; border-radius: .8vw .8vw 0 0; }
  .tile .name { font-size: 1.45vw; font-weight: 600; line-height: 1.15; }
  .tile .now { font-size: 1vw; color: var(--muted); margin-top: .35vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3vw; }
  .tile .prog { height: .25vw; background: rgba(255,255,255,.12); border-radius: .2vw; margin-top: .45vw; overflow: hidden; }
  .tile .prog i { display: block; height: 100%; background: var(--accent); }
  .tile .fav { position: absolute; top: .3vw; right: .3vw; font-size: 1.6vw; line-height: 1; color: #59617a;
    padding: .5vw .7vw; border-radius: .6vw; }
  .tile .fav.on { color: #ffcc4d; }
  .tile .fav:hover { background: rgba(255,255,255,.12); color: #ffcc4d; }
  .tile:hover, .tile.focus { border-color: var(--focus); background: #252c40; transform: scale(1.06); z-index: 2; }
  .g-rai .bar { background: var(--rai); } .g-mediaset .bar { background: var(--mediaset); }
  .g-wbd .bar { background: var(--wbd); } .g-altri .bar { background: var(--altri); }

  #player-view { position: fixed; inset: 0; background: #000; display: none; }
  #video { width: 100%; height: 100%; background: #000; }
  #osd { position: absolute; left: 3vw; bottom: 3vw; background: rgba(10,12,18,.82); padding: 1.2vw 1.8vw;
    border-radius: .8vw; display: flex; align-items: baseline; gap: 1.2vw; transition: opacity .4s; }
  #osd .num { font-size: 2.4vw; color: var(--muted); font-variant-numeric: tabular-nums; }
  #osd .name { font-size: 2.4vw; font-weight: 600; }
  #osd .state { font-size: 1.2vw; color: var(--muted); }
  #osd { flex-wrap: wrap; max-width: 55vw; }
  #osd .epg { flex-basis: 100%; font-size: 1.3vw; color: var(--text); line-height: 1.5; }
  #osd .epg b { color: var(--muted); font-weight: 500; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;
    font-size: 1.6vw; color: var(--text); background: rgba(10,12,18,.85); padding: 1.6vw 2.4vw; border-radius: .8vw; display: none; max-width: 60vw; }
  #numbuf { position: absolute; top: 3vw; right: 3vw; font-size: 4vw; font-weight: 700;
    background: rgba(10,12,18,.82); padding: .6vw 1.4vw; border-radius: .8vw; display: none; font-variant-numeric: tabular-nums; }
  .hidden { opacity: 0; }
  #controls { position: absolute; right: 3vw; bottom: 3vw; display: flex; gap: 1vw; transition: opacity .4s; }
  #controls button { font: inherit; font-size: 1.6vw; font-weight: 600; color: var(--text); background: rgba(21,25,34,.9);
    border: .22vw solid rgba(255,255,255,.25); border-radius: .8vw; padding: 1vw 1.8vw; cursor: pointer; }
  #controls button:hover { border-color: #fff; background: #2a3248; }
</style>
</head>
<body>

<div id="grid-view">
  <header>
    <div>
      <h1>TV Libera</h1>
      <div class="hint">Clicca un canale per guardarlo · ☆ per metterlo tra i preferiti · porta il puntatore in basso per scorrere</div>
    </div>
    <div style="text-align:right"><div id="clock"></div><div id="env" class="hint" style="font-size:.85vw"></div></div>
  </header>
  <div id="grid"></div>
</div>

<div id="player-view">
  <video id="video" autoplay playsinline></video>
  <div id="osd"><span class="num"></span><span class="name"></span><span class="state"></span><div class="epg"></div></div>
  <div id="msg"></div>
  <div id="numbuf"></div>
  <div id="controls">
    <button id="b-list">☰ Canali</button>
    <button id="b-prev">▲ Precedente</button>
    <button id="b-next">▼ Successivo</button>

  [64, "SuperTennis", "altri", ["https://live-embed.supertennix.hiway.media/restreamer/supertennix_client/gpu-a-c0-16/restreamer/outgest/aa3673f1-e178-44a9-a947-ef41db73211a/manifest.m3u8"]],

  [70, "Radio Italia TV", "altri", ["https://radioitaliatv.akamaized.net/hls/live/2093117/RadioitaliaTV/master.m3u8"]]
];
CHANNELS.sort(function (a, b) { return a[0] - b[0]; });

// TV8 ha un token Sky che scade: lo prendo dalla lista tvita.m3u, che i manutentori tengono aggiornata
var TV8_RE = /tvg-id="Tv8\.it"[^\n]*\r?\n(https?:\/\/\S+)/;
fetch("https://maginetweb-arch.github.io/tileoplayer/tvita.m3u").then(function (r) { return r.text(); }).then(function (t) {
  var m = t.match(TV8_RE);
  for (var i = 0; m && i < CHANNELS.length; i++) if (CHANNELS[i][0] === 8) CHANNELS[i][3].push(m[1]);
}).catch(function () {});

// ---------- stato ----------
var COLS = 6, focusIdx = 0, current = -1, mode = "grid";
var favs = loadFavs();
var hls = null, dash = null, osdTimer = null, numBuf = "", numTimer = null, okHold = null;
var gridEl = document.getElementById("grid"), video = document.getElementById("video");

function loadFavs() { try { return JSON.parse(localStorage.getItem("tvlibera-favs") || "[]"); } catch (e) { return []; } }
function saveFavs() { try { localStorage.setItem("tvlibera-favs", JSON.stringify(favs)); } catch (e) {} }
function isFav(n) { return favs.indexOf(n) !== -1; }
function order() {
  // preferiti in testa, poi gli altri per numero
  var f = [], o = [];
  for (var i = 0; i < CHANNELS.length; i++) (isFav(CHANNELS[i][0]) ? f : o).push(CHANNELS[i]);
  return f.concat(o);
}
var LIST = order();

// ---------- griglia ----------
function render() {
  var html = "";
  for (var i = 0; i < LIST.length; i++) {
    var c = LIST[i];
    html += '<div class="tile g-' + c[2] + (i === focusIdx ? " focus" : "") + '" data-i="' + i + '">' +
      '<div class="bar"></div><div class="num">' + c[0] + '</div>' +
      '<div class="fav' + (isFav(c[0]) ? ' on">★' : '">☆') + '</div>' +
      '<div class="name">' + c[1] + '</div>' + tileEpg(c[0]) + '</div>';
  }
  gridEl.innerHTML = html;
  scrollToFocus();
}
function setFocus(i) {
  if (i < 0 || i >= LIST.length) return;
  var old = gridEl.children[focusIdx]; if (old) old.className = old.className.replace(" focus", "");
  focusIdx = i;
  var el = gridEl.children[focusIdx]; if (el) el.className += " focus";
  scrollToFocus();
}
function scrollToFocus() {
  var el = gridEl.children[focusIdx]; if (!el || mode !== "grid") return;
  var r = el.getBoundingClientRect(), top = document.querySelector("header").offsetHeight;
  if (r.top < top) window.scrollBy(0, r.top - top - 10);
  else if (r.bottom > window.innerHeight) window.scrollBy(0, r.bottom - window.innerHeight + 10);
}
gridEl.addEventListener("click", function (e) {
  var star = e.target.className && String(e.target.className).indexOf("fav") === 0;
  var t = e.target; while (t && t !== gridEl && !t.getAttribute("data-i")) t = t.parentNode;
  if (!t || t === gridEl || !t.getAttribute) return;
  focusIdx = +t.getAttribute("data-i");
  if (star) { toggleFav(); return; }
  play(focusIdx);
});

// ---------- player ----------
function stopPlayback() {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  if (dash) { try { dash.reset(); } catch (e) {} dash = null; }
  try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
}
function play(i) {
  if (i < 0) i = LIST.length - 1; if (i >= LIST.length) i = 0;
  current = i; var c = LIST[i];
  mode = "player";
  gridScroll = window.pageYOffset || 0;
  document.getElementById("grid-view").style.display = "none";
  document.getElementById("player-view").style.display = "block";
  document.body.className = "playing"; showControls();
  hideMsg(); showOsd("Caricamento…");
  stopPlayback();

  tried = []; stuck = 0; recover = 0;
  if (!c[3].length) { // nessun flusso diretto (es. TV8): schermata con guida e pulsante
    stopPlayback(); playId++;
    showMsg(c[1] + " non ha una diretta da incorporare: si vede sul sito ufficiale." +
      '<br><button id="b-web" style="margin-top:1.2vw;font:inherit;font-size:1.6vw;font-weight:600;color:#fff;background:#2f6fde;border:0;border-radius:.8vw;padding:1vw 2vw;cursor:pointer">Apri ' + c[1] + ' sul sito ufficiale</button>');
    showOsd("solo sito ufficiale"); return;
  }
  trySource(c[3], 0);
}
function trySource(list, k, forceJs) {
  if (k >= list.length) return fail();
  curList = list; curK = k;
  var url = list[k], next = function () { trySource(list, k + 1); };
  if (forceJs && ENV.hlsjs && url.indexOf(".mpd") === -1) { playHlsJs(url, function () { playNative(url, next); }); return; }
  if (list.length > 1) tried.push("— fonte " + (k + 1) + " di " + list.length);
  if (url.indexOf(".mpd") !== -1) {
    if (ENV.nativeDash) playNative(url, function () { playDashJs(url, next); });
    else playDashJs(url, next);
  } else {
    // Prima il lettore della TV (non soggetto ai blocchi CORS), poi hls.js
    if (ENV.nativeHls) playNative(url, function () { playHlsJs(url, next); });
    else playHlsJs(url, function () { playNative(url, next); });
  }
}

// ---------- motori di riproduzione ----------
var tried = [], playId = 0, nativeNext = null, startTimer = null;
var ENV = {
  nativeHls: !!video.canPlayType && video.canPlayType("application/vnd.apple.mpegurl") !== "",
  nativeDash: !!video.canPlayType && video.canPlayType("application/dash+xml") !== "",
  mse: !!(window.MediaSource || window.WebKitMediaSource),
  hlsjs: !!(window.Hls && Hls.isSupported()),
  dashjs: !!window.dashjs
};
function envText() {
  return "HLS TV " + (ENV.nativeHls ? "sì" : "no") + " · DASH TV " + (ENV.nativeDash ? "sì" : "no") +
    " · MSE " + (ENV.mse ? "sì" : "no") + " · hls.js " + (ENV.hlsjs ? "sì" : "no") + " · dash.js " + (ENV.dashjs ? "sì" : "no");
}
function startPlay() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
function armTimeout(id, label, next) {
  clearTimeout(startTimer);
  startTimer = setTimeout(function () {
    if (id !== playId) return;
    tried.push(label + ": nessun segnale dopo 15s");
    if (next) next(); else fail();
  }, 15000);
}
function playNative(url, next) {
  stopPlayback(); var id = ++playId; nativeNext = { id: id, next: next };
  engine = { kind: "native", list: curList, k: curK };
  video.src = url; startPlay(); armTimeout(id, "lettore TV", next);
}
function playHlsJs(url, next) {
  stopPlayback(); var id = ++playId; nativeNext = null;
  if (!ENV.hlsjs) { tried.push("hls.js: non supportato"); return next ? next() : fail(); }
  // stima iniziale 5 Mbit/s (default 0,5): parte dalla qualità alta invece di salire piano
  hls = new Hls({ maxBufferLength: 20, liveSyncDurationCount: 3, abrEwmaDefaultEstimate: 5e6 });
  hls.on(Hls.Events.ERROR, function (ev, d) {
    if (!d.fatal || id !== playId) return;
    var code = d.response && d.response.code !== undefined ? " HTTP " + d.response.code : "";
    tried.push("hls.js: " + d.details + code);
    stopPlayback(); if (next) next(); else fail();
  });
  engine = { kind: "hlsjs", list: curList, k: curK };
  hls.loadSource(url); hls.attachMedia(video); startPlay(); armTimeout(id, "hls.js", next);

function playDashJs(url, next) {
  stopPlayback(); var id = ++playId; nativeNext = null;
  if (!ENV.dashjs || !ENV.mse) { tried.push("dash.js: non supportato"); return next ? next() : fail(); }
  dash = dashjs.MediaPlayer().create();
  dash.on("error", function (e) {
    if (id !== playId) return;
    var er = e && e.error ? (e.error.message || e.error.code || "") : "";
    tried.push("dash.js: " + er); stopPlayback(); if (next) next(); else fail();
  });
  dash.initialize(video, url, true); armTimeout(id, "dash.js", next);
}
video.addEventListener("playing", function () { clearTimeout(startTimer); showOsd(""); hideMsg(); });
video.addEventListener("resize", function () { if (mode === "player") showOsd(""); }); // mostra la nuova risoluzione
video.addEventListener("error", function () {
  if (!nativeNext || nativeNext.id !== playId) return;
  var codes = { 1: "interrotto", 2: "errore di rete", 3: "errore di decodifica", 4: "formato non supportato" };
  var c = video.error ? video.error.code : 0;
  tried.push("lettore TV: " + (codes[c] || "errore " + c));
  var next = nativeNext.next; nativeNext = null; clearTimeout(startTimer);
  if (next) next(); else fail();
});
function fail() {
  clearTimeout(startTimer); playId++;
  var web = LIST[current][4];
  showMsg("Questo canale non parte qui.<br>Usa i pulsanti in basso per cambiare canale o tornare alla lista." +
    (web ? '<br><button id="b-web" style="margin-top:1.2vw;font:inherit;font-size:1.6vw;font-weight:600;color:#fff;background:#2f6fde;border:0;border-radius:.8vw;padding:1vw 2vw;cursor:pointer">Apri sul sito ufficiale</button>' : "") +
    '<div style="margin-top:1vw;font-size:1.05vw;color:#8a93a8;text-align:left">' +
    tried.join("<br>") + "<br>" + envText() + "</div>");
  showOsd("non disponibile");
}
function showOsd(state) {
  var c = LIST[current], o = document.getElementById("osd");
  o.children[0].textContent = c[0]; o.children[1].textContent = c[1];
  o.children[2].textContent = state || (video.videoWidth ? video.videoWidth + "×" + video.videoHeight : "");
  o.children[3].innerHTML = osdEpg(c[0]);
  o.className = ""; clearTimeout(osdTimer);
  osdTimer = setTimeout(function () { if (!state) o.className = "hidden"; }, 3500);
}
function showMsg(t) { var m = document.getElementById("msg"); m.innerHTML = t; m.style.display = "block"; }
function hideMsg() { document.getElementById("msg").style.display = "none"; }
function backToGrid() {
  stopPlayback(); mode = "grid";
  document.getElementById("player-view").style.display = "none";
  document.getElementById("grid-view").style.display = "block";
  document.body.className = ""; window.scrollTo(0, gridScroll);
  setFocus(current < 0 ? 0 : current);
}

// ---------- recupero automatico se il video si blocca ----------
var engine = null, curList = null, curK = 0, stuck = 0, lastT = -1, started = false;
video.addEventListener("playing", function () { started = true; });
setInterval(function () {
  if (mode !== "player" || !started || video.paused || !engine) { lastT = video.currentTime; return; }
  if (video.currentTime === lastT) {
    stuck++;
    if (stuck === 3) {            // ~12s fermo: riavvia la diretta
      var e = engine; stuck = 0; started = false; recover++;
      showOsd("riconnessione…");
      // dal secondo blocco in poi prova il lettore web invece di quello della TV
      trySource(e.list, e.k, recover >= 2 && e.kind === "native");
    }
  } else stuck = 0;
  lastT = video.currentTime;
}, 4000);
var recover = 0;

// ---------- guida TV (epg.json aggiornato ogni 3 ore da GitHub) ----------
var EPG = {};
function loadEpg() {
  var x = new XMLHttpRequest();
  x.open("GET", "epg.json?t=" + Math.floor(Date.now() / 600000));
  x.onload = function () { try { EPG = JSON.parse(x.responseText).ch || {}; if (mode === "grid") render(); } catch (e) {} };
  x.send();
}
function hm(t) { var d = new Date(t * 1000), h = d.getHours(), m = d.getMinutes(); return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function nowNext(num) {
  var l = EPG[num]; if (!l) return null;
  var t = Date.now() / 1000;
  for (var i = 0; i < l.length; i++) if (l[i][0] <= t && l[i][1] > t) return { now: l[i], next: l[i + 1] };
  for (i = 0; i < l.length; i++) if (l[i][0] > t) return { now: null, next: l[i] };
  return null;
}
function tileEpg(num) {
  var n = nowNext(num); if (!n) return '<div class="now"></div>';
  if (!n.now) return '<div class="now">' + hm(n.next[0]) + " " + esc(n.next[2]) + '</div>';
  var pct = Math.max(0, Math.min(100, (Date.now() / 1000 - n.now[0]) / (n.now[1] - n.now[0]) * 100));
  return '<div class="now">' + esc(n.now[2]) + '</div><div class="prog"><i style="width:' + pct.toFixed(0) + '%"></i></div>';
}
function osdEpg(num) {
  var n = nowNext(num); if (!n) return "";
  var h = "";
  if (n.now) h += "<b>Ora</b> " + esc(n.now[2]) + " <b>fino alle " + hm(n.now[1]) + "</b>";
  if (n.next) h += (h ? "<br>" : "") + "<b>Dopo</b> " + esc(n.next[2]) + " <b>alle " + hm(n.next[0]) + "</b>";
  return h;
}
loadEpg(); setInterval(loadEpg, 30 * 60000);
setInterval(function () { if (mode === "grid") render(); }, 60000);

// ---------- pulsanti a schermo (puntatore della TV) ----------
var gridScroll = 0, ctrlTimer = null;
function showControls() {
  var c = document.getElementById("controls"); c.className = ""; clearTimeout(ctrlTimer);
  ctrlTimer = setTimeout(function () { c.className = "hidden"; }, 5000);
}
document.getElementById("player-view").addEventListener("mousemove", showControls);
document.getElementById("player-view").addEventListener("click", function (e) {
  var id = e.target.id;
  if (id === "b-web") { location.href = LIST[current][4]; }
  else if (id === "b-list") backToGrid();
  else if (id === "b-prev") play(current - 1);
  else if (id === "b-next") play(current + 1);
  else { showControls(); showOsd(""); }
});

// ---------- numeri ----------
function typeNum(d) {
  numBuf = (numBuf + d).slice(-3);
  var b = document.getElementById("numbuf");
  if (mode === "player") { b.textContent = numBuf; b.style.display = "block"; }
  clearTimeout(numTimer);
  numTimer = setTimeout(function () {
    var n = +numBuf; numBuf = ""; b.style.display = "none";
    for (var i = 0; i < LIST.length; i++) if (LIST[i][0] === n) { setFocus(i); if (mode === "player") play(i); return; }
  }, 1400);
}

// ---------- preferiti ----------
function toggleFav() {
  var c = LIST[focusIdx], n = c[0], k = favs.indexOf(n);
  if (k === -1) favs.push(n); else favs.splice(k, 1);
  saveFavs(); LIST = order();
  for (var i = 0; i < LIST.length; i++) if (LIST[i][0] === n) focusIdx = i;
  render();
}

// ---------- telecomando ----------
var BACK = [8, 27, 461, 10009, 166];
document.addEventListener("keydown", function (e) {
  var k = e.keyCode;
  if (k >= 48 && k <= 57) { typeNum(String(k - 48)); e.preventDefault(); return; }
  if (k >= 96 && k <= 105) { typeNum(String(k - 96)); e.preventDefault(); return; }

  if (mode === "grid") {
    if (k === 37) setFocus(focusIdx - 1);
    else if (k === 39) setFocus(focusIdx + 1);
    else if (k === 38) setFocus(focusIdx - COLS);
    else if (k === 40) setFocus(Math.min(focusIdx + COLS, LIST.length - 1));
    else if (k === 405 || k === 70) toggleFav(); // tasto giallo o F
    else if (k === 13) {
      if (e.repeat) return;
      okHold = setTimeout(function () { okHold = "done"; toggleFav(); }, 800);
    } else return;
    e.preventDefault();
  } else {
    if (k === 38 || k === 33 || k === 427) play(current - 1);
    else if (k === 40 || k === 34 || k === 428) play(current + 1);
    else if (k === 13 || k === 37 || k === 39) showOsd("");
    else if (BACK.indexOf(k) !== -1) backToGrid();
    else return;
    e.preventDefault();
  }
});
document.addEventListener("keyup", function (e) {
  if (mode === "grid" && e.keyCode === 13) {
    if (okHold === "done") { okHold = null; return; }
    clearTimeout(okHold); okHold = null; play(focusIdx);
  }
});

// ---------- orologio ----------
function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById("clock").textContent = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
tick(); setInterval(tick, 10000);
document.getElementById("env").textContent = envText() + " · v6";
if (location.search.indexOf("test") !== -1) runTest(); else render();

// ---------- test di tutti i canali (apri la pagina con ?test) ----------
function runTest() {
  document.querySelector(".hint").textContent = "Test dei canali in corso… (" + CHANNELS.length + " canali)";
  var rows = [], done = 0;
  gridEl.style.display = "block";
  gridEl.innerHTML = '<table id="t" style="width:100%;border-collapse:collapse;font-size:15px"></table>';
  var t = document.getElementById("t");
  CHANNELS.forEach(function (c, i) {
    var tr = document.createElement("tr");
    tr.innerHTML = '<td style="padding:4px 10px;color:#8a93a8">' + c[0] + '</td><td style="padding:4px 10px">' + c[1] +
      '</td><td style="padding:4px 10px" id="r' + i + '">…</td>';
    t.appendChild(tr);
    var cell = function (txt, ok) {
      var el = document.getElementById("r" + i); el.textContent = txt; el.style.color = ok ? "#4ade80" : "#f87171";
      rows[i] = c[0] + " " + c[1] + ": " + txt;
      if (++done === CHANNELS.length) {
        var okN = 0; for (var k = 0; k < rows.length; k++) if (rows[k].indexOf(": OK") !== -1) okN++;
        document.querySelector(".hint").textContent = "Test finito: " + okN + " su " + CHANNELS.length + " canali raggiungibili.";
      }
    };
    if (!c[3].length) { cell("solo sito ufficiale", true); return; }
    var notes = [];
    (function testSrc(k) {
      if (k >= c[3].length) return cell(notes.join(" · "), false);
      var finished = false, tag = c[3].length > 1 ? "fonte " + (k + 1) + ": " : "";
      var next = function (why) { if (finished) return; finished = true; notes.push(tag + why); testSrc(k + 1); };
      setTimeout(function () { next("nessuna risposta in 12s"); }, 12000);
      fetch(c[3][k], { cache: "no-store" }).then(function (r) {
        return r.text().then(function (body) {
          if (finished) return;
          var head = body.slice(0, 300);
          var looks = head.indexOf("#EXTM3U") !== -1 || head.indexOf("<MPD") !== -1 || head.indexOf("<?xml") !== -1;
          if (r.ok && looks) { finished = true; cell("OK" + (k ? " (fonte " + (k + 1) + ")" : ""), true); }
          else if (r.ok) next("risponde ma non è un video");
          else next("HTTP " + r.status);
        });
      }).catch(function () { next("bloccato o indirizzo morto"); });
    })(0);
  });
}
</script>
