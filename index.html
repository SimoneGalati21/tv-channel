<style>
  /* Palette "Video Streaming/OTT" di ui-ux-pro-max: nero cinema, rosso play, focus bianco */
  :root {
    --bg: #000; --surface: #0c0c0d; --tile: #141416; --tile-hi: #26262b; --line: rgba(255,255,255,.09);
    --text: #f8fafc; --muted: #94a3b8; --accent: #e11d48; --ring: #fff; --star: #fbbf24;
    --rai: #2f6fde; --mediaset: #e0453a; --wbd: #2bb5a0; --altri: #8b6ad8;
    --r: .9vw; --ease: cubic-bezier(.2, .8, .2, 1);

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100%;
    font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em; flex-shrink: 0; }
  body.playing { overflow: hidden; }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---------- griglia ---------- */
  #grid-view { padding: 0 3.2vw 4vw; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 2vw 0 1.4vw; }
  .brand { display: flex; align-items: center; gap: .8vw; font-size: 1.9vw; font-weight: 800; letter-spacing: -.02em; }
  .brand i { width: 1.1vw; height: 1.1vw; border-radius: 50%; background: var(--accent); box-shadow: 0 0 1.2vw rgba(225,29,72,.7); }
  .hint { color: var(--muted); font-size: .95vw; margin-top: .3vw; }
  .when { text-align: right; }
  #clock { font-size: 2.1vw; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #date { color: var(--muted); font-size: .95vw; text-transform: capitalize; }

  #hero { position: relative; display: flex; align-items: center; gap: 2.4vw; height: 14vw; padding: 0 2.6vw;
    border-radius: 1.4vw; overflow: hidden; background: var(--surface); border: 1px solid var(--line); margin-bottom: 1.6vw; }
  #hero:before { content: ""; position: absolute; inset: 0; opacity: .55; transition: background .4s var(--ease);
    background: radial-gradient(80% 140% at 0% 50%, var(--glow, #333) 0%, transparent 60%); }
  #hero > * { position: relative; }
  .h-logo { width: 12vw; height: 8.4vw; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .h-logo img { max-width: 100%; max-height: 100%; }
  .h-logo .txt { font-size: 2.4vw; font-weight: 800; text-align: center; }
  .h-body { flex: 1; min-width: 0; }
  .kicker { display: flex; align-items: center; gap: .8vw; font-size: 1vw; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .live { color: #fff; background: var(--accent); border-radius: .4vw; padding: .15vw .55vw; font-size: .8vw; font-weight: 800; letter-spacing: .08em; }
  .h-title { font-size: 2.6vw; font-weight: 800; letter-spacing: -.02em; margin: .5vw 0 .3vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-time { font-size: 1.1vw; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-time b { color: var(--text); font-weight: 600; }
  .prog { height: .3vw; background: rgba(255,255,255,.14); border-radius: .3vw; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); border-radius: .3vw; }
  .h-body .prog { width: 60%; margin-top: 1vw; }

  #bar { display: flex; align-items: center; gap: .8vw; margin-bottom: 1.6vw; flex-wrap: wrap; }
  .chip { font-size: 1.1vw; font-weight: 600; color: var(--muted); padding: .7vw 1.4vw; border-radius: 3vw;
    background: var(--tile); border: 1px solid var(--line); transition: background .15s, color .15s, transform .15s var(--ease); }
  .chip.on { color: #000; background: var(--text); }
  .chip .n { opacity: .55; margin-left: .4vw; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: .6vw; font-size: 1.15vw; font-weight: 700; padding: .8vw 1.6vw;
    border-radius: .8vw; background: var(--tile-hi); border: 1px solid var(--line); transition: background .15s, transform .15s var(--ease); }
  .btn.primary { background: var(--accent); border-color: transparent; }
  .chip:hover, .btn:hover, .kb { outline: .22vw solid var(--ring); outline-offset: .18vw; }

  #grid { display: flex; flex-wrap: wrap; gap: 1.2vw; padding: .5vw; }
  .tile { width: calc((100% - 5 * 1.2vw) / 6); height: 11.6vw; background: var(--tile); border-radius: var(--r);
    position: relative; display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line); transition: transform .18s var(--ease), background .18s, box-shadow .18s; }
  .tile .accent { position: absolute; left: 0; top: 0; bottom: 0; width: .3vw; }
  .tile .num { position: absolute; top: .7vw; left: 1vw; font-size: .95vw; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile .fav { position: absolute; top: .35vw; right: .35vw; font-size: 1.4vw; color: #4b5162; padding: .4vw; border-radius: .5vw; line-height: 0; }
  .tile .fav.on { color: var(--star); }
  .tile .fav.on svg { fill: currentColor; }
  .tile .fav:hover { color: var(--star); background: rgba(255,255,255,.1); }
  .tile .logo { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.6vw 2.2vw .2vw; min-height: 0; }
  .tile .logo img { max-width: 70%; max-height: 4.4vw; }
  .tile .logo .txt { font-size: 1.5vw; font-weight: 800; text-align: center; line-height: 1.1; }
  .tile .info { padding: 0 1vw .9vw 1.2vw; }
  .tile .name { font-size: 1vw; font-weight: 700; }
  .tile .now { font-size: .88vw; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2vw; margin-top: .15vw; }
  .tile .prog { margin-top: .45vw; height: .22vw; }
  .tile.focus { background: var(--tile-hi); transform: scale(1.07); z-index: 2;
    box-shadow: 0 0 0 .24vw var(--ring), 0 1.2vw 2.6vw rgba(0,0,0,.7); }
  .g-rai .accent { background: var(--rai); } .g-mediaset .accent { background: var(--mediaset); }
  .g-wbd .accent { background: var(--wbd); } .g-altri .accent { background: var(--altri); }
  .empty { color: var(--muted); font-size: 1.3vw; padding: 3vw 0; }

  /* ---------- player ---------- */
  #player-view { position: fixed; inset: 0; background: #000; display: none; }
  #video { width: 100%; height: 100%; background: #000; object-fit: contain; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 8vw 3.2vw 2.6vw;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 45%, transparent 100%); transition: opacity .35s; }
  .o-row { display: flex; align-items: center; gap: 2vw; }
  .o-logo { width: 8vw; height: 5.4vw; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: rgba(255,255,255,.06); border-radius: var(--r); padding: .8vw; }
  .o-logo img { max-width: 100%; max-height: 100%; }
  .o-logo .txt { font-size: 1.4vw; font-weight: 800; text-align: center; }
  .o-main { flex: 1; min-width: 0; }
  .o-top { display: flex; align-items: center; gap: .9vw; font-size: 1.2vw; }
  .o-num { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .o-name { font-weight: 800; }
  .o-state { color: var(--muted); font-size: 1vw; }
  .o-title { font-size: 2.3vw; font-weight: 800; letter-spacing: -.02em; margin: .3vw 0 .6vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-prog { display: flex; align-items: center; gap: 1vw; font-size: .95vw; color: var(--muted); font-variant-numeric: tabular-nums; max-width: 50vw; }
  .o-prog .prog { flex: 1; }
  .o-next { font-size: 1.05vw; color: var(--muted); margin-top: .6vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-next b { color: var(--text); font-weight: 600; }
  .o-side { text-align: right; align-self: flex-start; }
  .o-clock { font-size: 2vw; font-weight: 700; font-variant-numeric: tabular-nums; }
  .o-meta { font-size: .9vw; color: var(--muted); margin-top: .3vw; }
  #controls { display: flex; gap: .8vw; margin-top: 1.6vw; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: .6vw; font-size: 1.05vw; font-weight: 600; padding: .75vw 1.3vw;
    border-radius: .8vw; background: rgba(255,255,255,.1); border: 1px solid var(--line); transition: background .15s, transform .15s var(--ease); }
  .ctl svg { font-size: 1.3vw; }
  .ctl:hover, .ctl.kb { background: var(--text); color: #000; outline: none; }
  .ctl.on svg { color: var(--star); fill: var(--star); }
  .ctl.on:hover svg, .ctl.on.kb svg { color: #b45309; fill: #b45309; }
  .ctl[disabled] { opacity: .35; pointer-events: none; }
  #msg { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 1.5vw; line-height: 1.5;

  #msg .diag { margin-top: 1.2vw; font-size: .95vw; color: var(--muted); text-align: left; }
  .numbuf, #toast { position: absolute; top: 3vw; background: rgba(12,12,13,.9); border: 1px solid var(--line); border-radius: 1vw; display: none; }
  .numbuf { right: 3vw; font-size: 4vw; font-weight: 800; padding: .6vw 1.6vw; font-variant-numeric: tabular-nums; }
  #toast { left: 50%; transform: translateX(-50%); font-size: 1.3vw; font-weight: 600; padding: .9vw 1.8vw; }
  #grid-view .numbuf { position: fixed; z-index: 9; }

// ---------- player ----------
function stopPlayback() {

  try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
}
function playNum(n) {
  for (var i = 0; i < LIST.length; i++) if (LIST[i][0] === n) return play(i);
  if (!byNum(n)) return;
  filter = "all"; save("filter", filter); LIST = order(); renderBar();
  for (i = 0; i < LIST.length; i++) if (LIST[i][0] === n) return play(i);
}
function play(i) {
  if (!LIST.length) return;
  if (i < 0) i = LIST.length - 1; if (i >= LIST.length) i = 0;
  var c = LIST[i];
  if (lastNum !== c[0]) prevNum = lastNum; // lastNum = ultimo canale guardato prima di questo
  current = i; focusIdx = i; lastNum = c[0]; save("last", lastNum);
  if (mode !== "player") gridScroll = window.pageYOffset || 0;
  mode = "player";
  document.getElementById("grid-view").style.display = "none";
  document.getElementById("player-view").style.display = "block";
  document.body.className = "playing";
  hideMsg(); showHud("Caricamento…");
  stopPlayback();

  tried = []; stuck = 0; recover = 0; cancelRetry(); retryN = 0; everPlayed = false;
  if (!c[3].length) { // nessun flusso diretto (es. TV8 prima che arrivi la lista): pulsante per il sito
    stopPlayback(); playId++;
    showMsg(c[1] + " non ha una diretta da incorporare: si vede sul sito ufficiale." + webButton("Apri " + c[1] + " sul sito ufficiale"));
    showHud("solo sito ufficiale"); return;
  }
  trySource(c[3], 0);
}
function webButton(label) { return '<br><button class="btn primary" data-a="web"><svg><use href="#i-web"/></svg>' + label + "</button>"; }
function trySource(list, k, forceJs) {
  if (k >= list.length) return fail();
  curList = list; curK = k;
  var url = list[k], next = function () { trySource(list, k + 1); };
  if (forceJs && ENV.hlsjs && url.indexOf(".mpd") === -1) { playHlsJs(url, function () { playNative(url, next); }); return; }
  if (list.length > 1) tried.push("— fonte " + (k + 1) + " di " + list.length);
  if (url.indexOf(".mpd") !== -1) {
    if (ENV.nativeDash) playNative(url, function () { playDashJs(url, next); });
    else playDashJs(url, next);
  } else {
    // Prima hls.js (sul VIDAA parte molto prima del lettore TV), poi il lettore TV, che non è soggetto ai blocchi CORS
    playHlsJs(url, function () { playNative(url, next); });
  }
}

// ---------- motori di riproduzione ----------
var tried = [], playId = 0, nativeNext = null, startTimer = null;

  mse: !!(window.MediaSource || window.WebKitMediaSource),

  return "HLS TV " + (ENV.nativeHls ? "sì" : "no") + " · DASH TV " + (ENV.nativeDash ? "sì" : "no") +
    " · MSE " + (ENV.mse ? "sì" : "no") + " · hls.js " + (ENV.hlsjs ? "sì" : "no") + " · dash.js " + (ENV.dashjs ? "sì" : "no");
}
function startPlay() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
function armTimeout(id, label, next) {
  clearTimeout(startTimer);

    if (id !== playId) return;

}

video.addEventListener("playing", function () { clearTimeout(startTimer); hideMsg(); showHud(""); });

  showMsg("Questo canale non parte qui.<br>Cambia canale con su/giù oppure torna alla lista." +
    '<br><button class="btn primary" data-a="retry"><svg><use href="#i-back"/></svg>Riprova</button>' +
    (web ? webButton("Apri sul sito ufficiale") : "") +
    '<div class="diag">' + tried.join("<br>") + "<br>" + envText() + "</div>");

// ---------- riconnessione automatica ----------
var RETRY_S = [5, 10, 20, 30, 30, 30, 60, 60], retryN = 0, retryTimer = null, retryAt = 0, everPlayed = false;

    '<br>Nuovo tentativo tra <b id="retry-s">' + s + "</b> s (" + retryN + " di " + RETRY_S.length + ")" +
    '<br><button class="btn primary" data-a="retry"><svg><use href="#i-back"/></svg>Riprova ora</button>');
  showHud("riconnessione…");
}

  trySource(LIST[current][3], 0);

setInterval(function () {
  var el = document.getElementById("retry-s");

}, 1000);
// se il browser segnala il ritorno della rete non aspetto il prossimo tentativo
window.addEventListener("online", function () { if (retryTimer) retryNow(); });

// ---------- barra in sovrimpressione ----------

function audioInfo() {
  if (hls && hls.audioTracks && hls.audioTracks.length > 1) {

function action(a) {
  var c = LIST[current];
  if (a === "list") backToGrid();
  else if (a === "prev") play(current - 1);
  else if (a === "next") play(current + 1);
  else if (a === "last") { if (byNum(prevNum)) playNum(prevNum); }
  else if (a === "fav") { toggleFav(c[0]); toast(isFav(c[0]) ? c[1] + " aggiunto ai preferiti" : c[1] + " tolto dai preferiti"); }
  else if (a === "audio") { var au = audioInfo(); if (au) { au.set((au.cur + 1) % au.names.length); toast("Audio: " + au.names[(au.cur + 1) % au.names.length]); } }
  else if (a === "fit") { setFit(fitIdx + 1); toast("Formato: " + FITS[fitIdx][1]); }
  else if (a === "sleep") cycleSleep();
  else if (a === "web") { location.href = c[4]; return; }
  else if (a === "resume") { play(current); return; }
  else if (a === "retry") { retryN = 0; retryNow(); return; }
  if (mode === "player") showHud("");
}
var playerView = document.getElementById("player-view");
playerView.addEventListener("mousemove", function () { if (document.getElementById("hud").className) showHud(""); });
playerView.addEventListener("click", function (e) {

setFit(fitIdx);

// ---------- timer di spegnimento: ferma la riproduzione (lo spegnimento della TV non è accessibile da una pagina web) ----------
var SLEEP_STEPS = [0, 30, 60, 90, 120], sleepEnd = 0;

  for (var i = 0; i < SLEEP_STEPS.length; i++) if (SLEEP_STEPS[i] > left + 1) { next = SLEEP_STEPS[i]; break; }
  sleepEnd = next ? Date.now() + next * 60000 : 0;
  toast(next ? "La riproduzione si ferma tra " + next + " minuti" : "Timer disattivato");
}
setInterval(function () {
  if (!sleepEnd || Date.now() < sleepEnd) return;
  sleepEnd = 0;
  if (mode !== "player") return;
  stopPlayback(); playId++; clearTimeout(startTimer); cancelRetry();
  showMsg("Timer scaduto: la riproduzione è stata fermata.<br>" +
    '<button class="btn primary" data-a="resume"><svg><use href="#i-play"/></svg>Riprendi ' + LIST[current][1] + "</button>");
  showHud("in pausa");
}, 15000);

// ---------- recupero automatico se il video si blocca ----------
var engine = null, curList = null, curK = 0, stuck = 0, lastT = -1, started = false;
video.addEventListener("playing", function () { started = true; });
setInterval(function () {
  if (mode !== "player" || !started || video.paused || !engine) { lastT = video.currentTime; return; }
  if (video.currentTime === lastT) {
    stuck++;
    if (stuck === 3) {            // ~12s fermo: riavvia la diretta
      var e = engine; stuck = 0; started = false; recover++;
      showHud("riconnessione…");
      // dal secondo blocco in poi prova il lettore web invece di quello della TV
      trySource(e.list, e.k, recover >= 2 && e.kind === "native");
    }
  } else stuck = 0;
  lastT = video.currentTime;
}, 4000);
var recover = 0;

// ---------- guida TV (epg.json aggiornato ogni 3 ore da GitHub) ----------
var EPG = {};
function loadEpg() {
  var x = new XMLHttpRequest();
  x.open("GET", "epg.json?t=" + Math.floor(Date.now() / 600000));
  x.onload = function () { try { EPG = JSON.parse(x.responseText).ch || {}; if (mode === "grid") render(); } catch (e) {} };
  x.send();
}
function hm(t) { var d = new Date(t * 1000), h = d.getHours(), m = d.getMinutes(); return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function pct(p) { return Math.max(0, Math.min(100, (Date.now() / 1000 - p[0]) / (p[1] - p[0]) * 100)).toFixed(0); }
function nowNext(num) {
  var l = EPG[num]; if (!l) return null;
  var t = Date.now() / 1000;
  for (var i = 0; i < l.length; i++) if (l[i][0] <= t && l[i][1] > t) return { now: l[i], next: l[i + 1] };
  for (i = 0; i < l.length; i++) if (l[i][0] > t) return { now: null, next: l[i] };
  return null;
}
function tileEpg(num) {
  var n = nowNext(num); if (!n) return '<div class="now"></div>';
  if (!n.now) return '<div class="now">' + hm(n.next[0]) + " " + esc(n.next[2]) + "</div>";
  return '<div class="now">' + esc(n.now[2]) + '</div><div class="prog"><i style="width:' + pct(n.now) + '%"></i></div>';
}
loadEpg(); setInterval(loadEpg, 30 * 60000);
setInterval(function () { if (mode === "grid") render(); }, 60000);
var gridScroll = 0;

// ---------- numeri ----------
function typeNum(d) {
  numBuf = (numBuf + d).slice(-3);
  var b = document.getElementById(mode === "player" ? "player-view" : "grid-view").querySelector(".numbuf");
  b.textContent = numBuf; b.style.display = "block";
  clearTimeout(numTimer);
  numTimer = setTimeout(function () {
    var n = +numBuf; numBuf = ""; b.style.display = "none";
    if (!byNum(n)) return;
    if (mode === "player") return playNum(n);
    for (var i = 0; i < LIST.length; i++) if (LIST[i][0] === n) return setFocus(i);
    filter = "all"; save("filter", filter); LIST = order(); render();
    for (i = 0; i < LIST.length; i++) if (LIST[i][0] === n) return setFocus(i);
  }, 1400);
}

// ---------- preferiti ----------
function toggleFav(n) {
  var k = favs.indexOf(n);
  if (k === -1) favs.push(n); else favs.splice(k, 1);
  save("favs", favs);
  var curNum = current >= 0 && LIST[current] ? LIST[current][0] : -1;
  LIST = order();
  // tolto dai preferiti il canale in onda mentre il filtro è "Preferiti": passo a "Tutti" per non perderlo
  if (mode === "player" && !matches(byNum(curNum), filter)) { filter = "all"; save("filter", filter); LIST = order(); }
  for (var i = 0; i < LIST.length; i++) { if (LIST[i][0] === n) focusIdx = i; if (LIST[i][0] === curNum) current = i; }
  if (mode === "grid") render(); else updateControls();
}

// ---------- telecomando ----------
var BACK = [8, 27, 461, 10009, 166];
// ?keys nell'indirizzo: mostra a schermo i tasti che arrivano alla pagina (nel TV Browser alcuni li prende il puntatore)
if (/[?&]keys\b/.test(location.search)) {
  var keyLog = document.createElement("pre");
  keyLog.style.cssText = "position:fixed;top:1vw;left:1vw;z-index:99;background:rgba(0,0,0,.9);color:#4ade80;font:1.3vw monospace;padding:1vw;border:1px solid #4ade80;border-radius:.6vw;pointer-events:none;white-space:pre";
  keyLog.textContent = "Premi i tasti del telecomando…";
  document.body.appendChild(keyLog);
  ["keydown", "keyup"].forEach(function (t) {
    document.addEventListener(t, function (e) {
      keyLog.textContent = (t + " " + e.keyCode + " " + (e.key || "") + "\n" + keyLog.textContent).split("\n").slice(0, 14).join("\n");
    }, true);
  });
}
document.addEventListener("keydown", function (e) {
  var k = e.keyCode;
  if (k >= 48 && k <= 57) { typeNum(String(k - 48)); e.preventDefault(); return; }
  if (k >= 96 && k <= 105) { typeNum(String(k - 96)); e.preventDefault(); return; }

  if (mode === "grid") {
    var nb = barEl.querySelectorAll("button").length;
    if (zone === "bar") {
      if (k === 37) barIdx = Math.max(0, barIdx - 1);
      else if (k === 39) barIdx = Math.min(nb - 1, barIdx + 1);
      else if (k === 40 && LIST.length) { setFocus(focusIdx); return e.preventDefault(); }
      else if (k === 13) { barAction(barEl.querySelectorAll("button")[barIdx].getAttribute("data-f")); return e.preventDefault(); }
      else return;
      markBar(); e.preventDefault(); return;
    }
    if (k === 37) setFocus(focusIdx - 1);
    else if (k === 39) setFocus(focusIdx + 1);
    else if (k === 38) {
      if (focusIdx < COLS) { zone = "bar"; var old = gridEl.children[focusIdx]; if (old) old.className = old.className.replace(" focus", ""); markBar(); window.scrollTo(0, 0); }
      else setFocus(focusIdx - COLS);
    }
    else if (k === 40) setFocus(Math.min(focusIdx + COLS, LIST.length - 1));
    else if (k === 405 || k === 70) { if (LIST[focusIdx]) toggleFav(LIST[focusIdx][0]); } // tasto giallo o F
    else if (k === 406 && byNum(lastNum)) playNum(lastNum); // tasto blu: riprendi
    else if (k === 13) {
      if (e.repeat || !LIST.length) return;
      okHold = setTimeout(function () { okHold = "done"; toggleFav(LIST[focusIdx][0]); }, 800);
    } else return;
    e.preventDefault();
  } else {
    var nc = ctlButtons().length;
    if (hudFocus >= 0 && (k === 37 || k === 39)) { hudFocus = (hudFocus + (k === 39 ? 1 : nc - 1)) % nc; showHud(""); markControls(); }
    else if (hudFocus >= 0 && k === 13) { if (!e.repeat) action(ctlButtons()[hudFocus].getAttribute("data-a")); }
    else if (k === 13 && document.getElementById("msg").style.display === "block" && document.getElementById("msg").querySelector("[data-a]")) {
      action(document.getElementById("msg").querySelector("[data-a]").getAttribute("data-a"));
    }
    else if (k === 13 || k === 37 || k === 39) { hudFocus = 0; showHud(""); markControls(); }
    else if (k === 38 || k === 33 || k === 427) play(current - 1);
    else if (k === 40 || k === 34 || k === 428) play(current + 1);
    else if (k === 403) action("fit");   // rosso
    else if (k === 404) action("audio"); // verde
    else if (k === 405) action("fav");   // giallo
    else if (k === 406) action("last");  // blu
    else if (BACK.indexOf(k) !== -1) { if (hudFocus >= 0) hideHud(); else backToGrid(); }
    else return;
    e.preventDefault();
  }
});
document.addEventListener("keyup", function (e) {
  if (mode === "grid" && zone === "grid" && e.keyCode === 13) {
    if (okHold === "done") { okHold = null; return; }
    if (okHold === null) return;
    clearTimeout(okHold); okHold = null; play(focusIdx);
  }
});

// ---------- orologio ----------
var GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
function clockText() { var d = new Date(), h = d.getHours(), m = d.getMinutes(); return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function tick() {
  var d = new Date();
  document.getElementById("clock").textContent = clockText();
  document.getElementById("date").textContent = GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()];
  if (mode === "player" && !document.getElementById("hud").className) document.querySelector(".o-clock").textContent = clockText();
}
tick(); setInterval(tick, 10000);
if (location.search.indexOf("test") !== -1) runTest(); else render();

// ---------- test di tutti i canali (apri la pagina con ?test) ----------
function runTest() {
  document.getElementById("hero").style.display = "none"; barEl.style.display = "none";
  document.querySelector(".hint").textContent = "Test dei canali in corso… (" + CHANNELS.length + " canali)";
  var rows = [], done = 0;
  gridEl.style.display = "block";
  gridEl.innerHTML = '<table id="t" style="width:100%;border-collapse:collapse;font-size:15px"></table>';
  var t = document.getElementById("t");
  CHANNELS.forEach(function (c, i) {
    var tr = document.createElement("tr");
    tr.innerHTML = '<td style="padding:4px 10px;color:#94a3b8">' + c[0] + '</td><td style="padding:4px 10px">' + c[1] +
      '</td><td style="padding:4px 10px" id="r' + i + '">…</td>';
    t.appendChild(tr);
    var cell = function (txt, ok) {
      var el = document.getElementById("r" + i); el.textContent = txt; el.style.color = ok ? "#4ade80" : "#f87171";
      rows[i] = c[0] + " " + c[1] + ": " + txt;
      if (++done === CHANNELS.length) {
        var okN = 0; for (var k = 0; k < rows.length; k++) if (rows[k].indexOf(": OK") !== -1) okN++;
        document.querySelector(".hint").textContent = "Test finito: " + okN + " su " + CHANNELS.length + " canali raggiungibili. " + envText();
      }
    };
    if (!c[3].length) { cell("solo sito ufficiale", true); return; }
    var notes = [];
    (function testSrc(k) {
      if (k >= c[3].length) return cell(notes.join(" · "), false);
      var finished = false, tag = c[3].length > 1 ? "fonte " + (k + 1) + ": " : "";
      var next = function (why) { if (finished) return; finished = true; notes.push(tag + why); testSrc(k + 1); };
      setTimeout(function () { next("nessuna risposta in 12s"); }, 12000);
      fetch(c[3][k], { cache: "no-store" }).then(function (r) {
        return r.text().then(function (body) {
          if (finished) return;
          var head = body.slice(0, 300);
          var looks = head.indexOf("#EXTM3U") !== -1 || head.indexOf("<MPD") !== -1 || head.indexOf("<?xml") !== -1;
          if (r.ok && looks) { finished = true; cell("OK" + (k ? " (fonte " + (k + 1) + ")" : ""), true); }
          else if (r.ok) next("risponde ma non è un video");
          else next("HTTP " + r.status);
        });
      }).catch(function () { next("bloccato o indirizzo morto"); });
    })(0);
  });
}
</script>
