name: Aggiorna guida TV

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:
  push:
    paths:
      - "epg/**"
      - ".github/workflows/epg.yml"

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa dipendenze
        run: npm install --no-save --no-package-lock cheerio@1
      - name: Scarica la programmazione
        run: node epg/build.mjs
      - name: Salva epg.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.json epg/debug-sgt.html 2>/dev/null || git add epg.json
          git diff --cached --quiet || git commit -m "Aggiorna guida TV"
          git pull --rebase origin main && git push
